user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log  /var/log/nginx/access.log  main_json;

    # Performance Tuning
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=purastone_api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=purastone_login_limit:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=purastone_conn_limit:10m;

    # Upstream backend pool using least-connections load balancing
    upstream purastone_backend_pool {
        least_conn;
        server backend-1:8000 max_fails=3 fail_timeout=10s weight=1;
        server backend-2:8000 max_fails=3 fail_timeout=10s weight=1;
        server backend-3:8000 max_fails=3 fail_timeout=10s weight=1;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
