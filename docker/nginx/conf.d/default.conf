server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Liveness and Readiness Probes for Kubernetes / Docker / AWS ALB
    location = /healthz {
        proxy_pass http://purastone_backend_pool/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://purastone_backend_pool/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Redirect all non-health HTTP traffic to HTTPS in strict production environments
    # Uncomment when SSL certificates are mounted
    # return 301 https://$host$request_uri;

    # OWASP & DevSecOps Hardened Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # Static Assets Cache
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Encrypted Media Assets
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "private, no-transform";
    }

    # Authentication & Login Endpoints (Strict Rate Limiting)
    location ~* ^/api/(core/auth|accounts)/login/ {
        limit_req zone=purastone_login_limit burst=10 nodelay;
        limit_conn purastone_conn_limit 10;

        proxy_pass http://purastone_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Endpoints (Standard API Rate Limiting)
    location /api/ {
        limit_req zone=purastone_api_limit burst=50 nodelay;
        limit_conn purastone_conn_limit 50;

        proxy_pass http://purastone_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin Portal
    location /admin/ {
        limit_req zone=purastone_login_limit burst=10 nodelay;
        proxy_pass http://purastone_backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default SPA root
    location / {
        proxy_pass http://purastone_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
