version: '3.9'

services:
  # PostgreSQL 16 Enterprise Relational Engine
  db-primary:
    image: postgres:16-alpine
    container_name: purastone-db-primary
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-purastone_db}
      POSTGRES_USER: ${DB_USER:-purastone_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-PurastoneP0stgresSecure2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      - backup_data:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - purastone-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-purastone_admin} -d ${DB_NAME:-purastone_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis 7 In-Memory Cache, Rate Limiter & Celery Broker
  redis:
    image: redis:7.2-alpine
    container_name: purastone-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-PurastoneRedisSecure2026!}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - purastone-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-PurastoneRedisSecure2026!}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend Replica 1 (Stateless Gunicorn Worker)
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purastone-backend-1
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: ims_core.settings
      SECRET_KEY: ${SECRET_KEY:-purastone-prod-secret-key-high-entropy-2026}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-purastone_db}
      DB_USER: ${DB_USER:-purastone_admin}
      DB_PASSWORD: ${DB_PASSWORD:-PurastoneP0stgresSecure2026!}
      DB_HOST: db-primary
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/1
      CELERY_ALWAYS_EAGER: "False"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - purastone-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Backend Replica 2 (Stateless Gunicorn Worker)
  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purastone-backend-2
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: ims_core.settings
      SECRET_KEY: ${SECRET_KEY:-purastone-prod-secret-key-high-entropy-2026}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-purastone_db}
      DB_USER: ${DB_USER:-purastone_admin}
      DB_PASSWORD: ${DB_PASSWORD:-PurastoneP0stgresSecure2026!}
      DB_HOST: db-primary
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/1
      CELERY_ALWAYS_EAGER: "False"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - purastone-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Backend Replica 3 (Stateless Gunicorn Worker)
  backend-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purastone-backend-3
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: ims_core.settings
      SECRET_KEY: ${SECRET_KEY:-purastone-prod-secret-key-high-entropy-2026}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-purastone_db}
      DB_USER: ${DB_USER:-purastone_admin}
      DB_PASSWORD: ${DB_PASSWORD:-PurastoneP0stgresSecure2026!}
      DB_HOST: db-primary
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/1
      CELERY_ALWAYS_EAGER: "False"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - purastone-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Celery Asynchronous Task Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purastone-celery-worker
    restart: always
    command: celery -A ims_core worker -l INFO -c 4 -Q default,settlement,pdf,fefo
    environment:
      DJANGO_SETTINGS_MODULE: ims_core.settings
      SECRET_KEY: ${SECRET_KEY:-purastone-prod-secret-key-high-entropy-2026}
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-purastone_db}
      DB_USER: ${DB_USER:-purastone_admin}
      DB_PASSWORD: ${DB_PASSWORD:-PurastoneP0stgresSecure2026!}
      DB_HOST: db-primary
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/1
      CELERY_ALWAYS_EAGER: "False"
    volumes:
      - media_volume:/app/media
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - purastone-internal

  # Celery Beat Periodic Task Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purastone-celery-beat
    restart: always
    command: celery -A ims_core beat -l INFO --pidfile /tmp/celerybeat.pid
    environment:
      DJANGO_SETTINGS_MODULE: ims_core.settings
      SECRET_KEY: ${SECRET_KEY:-purastone-prod-secret-key-high-entropy-2026}
      DEBUG: "False"
      DB_NAME: ${DB_NAME:-purastone_db}
      DB_USER: ${DB_USER:-purastone_admin}
      DB_PASSWORD: ${DB_PASSWORD:-PurastoneP0stgresSecure2026!}
      DB_HOST: db-primary
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-PurastoneRedisSecure2026!}@redis:6379/1
      CELERY_ALWAYS_EAGER: "False"
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - purastone-internal

  # Nginx Reverse Proxy & Least-Connections Load Balancer
  nginx:
    image: nginx:1.25-alpine
    container_name: purastone-nginx-lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - static_volume:/var/www/static:ro
      - media_volume:/var/www/media:ro
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      backend-3:
        condition: service_healthy
    networks:
      - purastone-internal
      - purastone-public

networks:
  purastone-internal:
    driver: bridge
    internal: true
  purastone-public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backup_data:
  static_volume:
  media_volume:
